name: govulncheck

on:
  push:
    paths:
      - '**.go'
      - go.mod
      - go.sum
      - .github/workflows/vulncheck.yml
  pull_request:
    paths:
      - '**.go'
      - go.mod
      - go.sum
      - .github/workflows/vulncheck.yml
  schedule:
    # Weekly: catches advisories published against unchanged code.
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # govulncheck refuses to load packages under a toolchain older than
          # the go directive, so track go.mod rather than hardcoding a version.
          go-version-file: go.mod
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...
