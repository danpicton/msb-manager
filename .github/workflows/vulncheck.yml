name: govulncheck

on:
  push:
    paths:
      - '**.go'
      - go.mod
      - go.sum
      - .github/workflows/vulncheck.yml
  pull_request:
    paths:
      - '**.go'
      - go.mod
      - go.sum
      - .github/workflows/vulncheck.yml
  schedule:
    # Weekly: catches advisories published against unchanged code.
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          # govulncheck refuses to load packages under a toolchain older than
          # the go directive, so track go.mod rather than hardcoding a version.
          go-version-file: go.mod
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...
